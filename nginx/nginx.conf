events {}

http {
    upstream nextjs {
        server nextjs:3000;
    }

    # HTTP: Both domains redirect to HTTPS
    server {
        listen 80;
        server_name nitish.site portfolio.nitish.site;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Root domain: Intentionally serve nothing
    server {
        listen 443 ssl;
        server_name nitish.site;

        ssl_certificate /etc/letsencrypt/live/nitish.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nitish.site/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        return 404;
    }

    # Portfolio subdomain: Next.js application
    server {
        listen 443 ssl;
        server_name portfolio.nitish.site;

        ssl_certificate /etc/letsencrypt/live/nitish.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nitish.site/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
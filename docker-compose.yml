services:
  nextjs:
    build: .
    container_name: portfolio_nextjs
    ports:
      - "3000:3000"  # Expose to host for direct access
    environment:
      - NODE_ENV=production
    restart: always
    networks:
      - app_network

  nginx:
    image: nginx:1.25-alpine
    container_name: portfolio_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - nextjs
    networks:
      - app_network


networks:
  app_network:
    driver: bridge

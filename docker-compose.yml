services:
  nextjs:
    build: .
    container_name: portfolio_nextjs
    environment:
      - NODE_ENV=production
    restart: always
    env_file:
      - .env.production
    networks:
      - app_network

  nginx:
    image: nginx:1.25-alpine
    container_name: portfolio_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_data:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - nextjs
    networks:
      - app_network

  certbot:
    image: certbot/dns-cloudflare
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - ./secrets/cloudflare.ini:/etc/letsencrypt/cloudflare.ini:ro

volumes:
  certbot_data:
  certbot_www:

networks:
  app_network:
    driver: bridge
